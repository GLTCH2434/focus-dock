<!-- Vector version of the dock icon, used as the browser tab favicon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- soft blur turns the plain circles into glowing blobs -->
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <clipPath id="r"><rect width="512" height="512" rx="113"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#0a0f1c"/>
    <g filter="url(#b)">
      <circle cx="110" cy="100" r="170" fill="#6d5efc"/>
      <circle cx="400" cy="330" r="180" fill="#19c3b1"/>
      <circle cx="190" cy="430" r="150" fill="#ff6f91"/>
      <circle cx="355" cy="80" r="95" fill="#f5b94a" opacity=".8"/>
    </g>
    <circle cx="256" cy="256" r="150" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".47" stroke-width="3"/>
    <path d="M256 256l-60-52M256 256l75-85" stroke="#eef0f8" stroke-width="13" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="12" fill="#eef0f8"/>
  </g>
</svg>
