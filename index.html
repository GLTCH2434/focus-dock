<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk Dock</title>
<!-- Makes the page fill a small screen properly -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<!-- App install info: icons, manifest, and the iPhone/iPad "Add to Home Screen" settings -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dock">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Font is optional: if it fails to load, the system font is used instead -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap" rel="stylesheet">

<style>
/* ---------- Colours and basics ----------
   Change these few values to re-theme the whole dock. */
:root{
  --bg:#0a0f1c;            /* deep night blue background */
  --ink:#eef0f8;           /* main text colour */
  --dim:rgba(238,240,248,.55);
  --glass:rgba(255,255,255,.07);
  --edge:rgba(255,255,255,.16);
  --b1:#6d5efc; --b2:#19c3b1; --b3:#ff6f91; --b4:#f5b94a; /* the four blob colours */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:'Sora',system-ui,sans-serif}
/* Cursor and buttons fade away when you stop touching the dock (see JS "idle") */
body.idle{cursor:none}
body.idle .bar{opacity:0;pointer-events:none}

/* ---------- Blob background ----------
   Four big blurred shapes that slowly drift AND change shape.
   Two animations run at different speeds so the motion never visibly repeats. */
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0}
.blob{position:absolute;width:46vmax;height:46vmax;filter:blur(42px);opacity:.55;
  will-change:transform;
  animation:drift 30s ease-in-out infinite alternate, morph 15s ease-in-out infinite}
.blob:nth-child(1){background:var(--b1);top:-15%;left:-10%}
.blob:nth-child(2){background:var(--b2);top:30%;right:-18%;animation-duration:36s,19s}
.blob:nth-child(3){background:var(--b3);bottom:-25%;left:15%;animation-duration:27s,13s;opacity:.45}
.blob:nth-child(4){background:var(--b4);top:5%;left:42%;width:26vmax;height:26vmax;
  animation-duration:41s,17s;opacity:.35}
@keyframes drift{
  0%{transform:translate(0,0) rotate(0)}
  50%{transform:translate(12vw,-8vh) rotate(90deg)}
  100%{transform:translate(-8vw,10vh) rotate(200deg)}}
@keyframes morph{ /* changing border-radius is what makes a square look like a blob */
  0%,100%{border-radius:42% 58% 63% 37% / 45% 40% 60% 55%}
  33%{border-radius:60% 40% 35% 65% / 55% 62% 38% 45%}
  66%{border-radius:38% 62% 55% 45% / 62% 36% 64% 38%}}

/* ---------- Layout ---------- */
.dock{position:relative;z-index:1;height:100%;display:grid;
  grid-template-columns:1.35fr 1fr;gap:clamp(12px,3vmin,32px);
  padding:clamp(14px,4vmin,44px)}
/* On tall/portrait screens, stack clock above notes */
@media (max-aspect-ratio:1/1){.dock{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding-top:calc(clamp(40px,7vmin,56px) + clamp(18px,4vmin,40px));padding-bottom:calc(clamp(40px,7vmin,56px) + clamp(18px,4vmin,40px))}}

.clock{align-self:center;min-width:0}
.time{font-size:clamp(56px,25vmin,280px);font-weight:200;letter-spacing:-.045em;
  line-height:.95;font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;
  text-shadow:0 4px 40px rgba(10,15,28,.35)}
.time small{font-size:.22em;letter-spacing:0;font-weight:300;color:var(--dim);margin-left:.25em}
.date{margin-top:1.2vmin;font-size:clamp(14px,3.6vmin,34px);font-weight:300;color:var(--dim)}

/* ---------- Glass panels (notes + noise player) ---------- */
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:clamp(18px,3.5vmin,32px);
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 60px rgba(0,0,0,.25)}
.notes{display:flex;flex-direction:column;min-height:0;padding:clamp(14px,2.8vmin,28px)}
.notes h2{font-size:clamp(13px,2.4vmin,18px);font-weight:600;margin-bottom:1.2vmin}
#list{list-style:none;padding:0;overflow:auto;flex:1;min-height:0}
#list li{display:flex;gap:10px;align-items:flex-start;padding:.9vmin 0;
  font-size:clamp(14px,2.7vmin,22px);font-weight:300;line-height:1.35;cursor:pointer}
#list li span{flex:1;word-break:break-word}
#list li.done span{text-decoration:line-through;opacity:.4}
#list li button{opacity:.4}
.notes input{margin-top:1.2vmin;width:100%;padding:.9em 1em;border-radius:14px;color:var(--ink);
  background:rgba(255,255,255,.08);border:1px solid var(--edge);font-family:inherit;font-weight:300;font-size:clamp(13px,2.4vmin,18px)}
.notes input::placeholder{color:var(--dim)}

/* ---------- Buttons ---------- */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
.bar{position:fixed;top:clamp(10px,2.5vmin,26px);left:clamp(10px,2.5vmin,26px);z-index:3;
  display:flex;gap:8px;transition:opacity .6s}
.bar button{width:clamp(40px,7vmin,56px);height:clamp(40px,7vmin,56px);display:grid;place-items:center;
  border-radius:50%;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.bar button:hover{background:rgba(255,255,255,.14)}
.bar svg{width:48%;height:48%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* When noise is playing, the noise button glows so you can tell at a glance */
#menuBtn.on{border-color:var(--b2);box-shadow:0 0 0 0 rgba(25,195,177,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(25,195,177,0)}100%{box-shadow:0 0 0 0 rgba(25,195,177,0)}}

/* ---------- White noise panel ---------- */
#menuPanel{position:fixed;z-index:4;left:clamp(10px,2.5vmin,26px);
  top:calc(clamp(40px,7vmin,56px) + clamp(18px,4vmin,40px));width:min(360px,calc(100vw - 24px));
  max-height:calc(100% - 90px);overflow:auto;padding:20px;display:none;flex-direction:column;gap:16px;
  background:rgba(18,24,44,.55);animation:pop .22s ease-out}
#menuPanel.open{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}}
.row{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--dim)}
.row b{font-weight:400;display:flex;justify-content:space-between}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.types button{padding:10px 0;border-radius:12px;border:1px solid var(--edge);font-size:13px}
.types button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{padding:14px;border-radius:16px;font-weight:600;background:var(--b2);color:#04211e}
.play.on{background:var(--b3);color:#2b0713}
input[type=range]{width:100%;accent-color:var(--b2)}
select{padding:10px;border-radius:12px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--edge);font:inherit}
select option{color:#111}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swatches input{width:100%;height:48px;padding:0;border:1px solid var(--edge);border-radius:12px;background:none;cursor:pointer}
.ghost{padding:10px;border-radius:12px;border:1px solid var(--edge);font-size:13px}
.status{font-size:12px;color:var(--dim);min-height:1.2em}

/* Tabs inside the menu + the panes they switch between */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{padding:10px 0;border-radius:12px;border:1px solid var(--edge);font-size:13px}
.tabs button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{display:flex;flex-direction:column;gap:16px}
.pane[hidden]{display:none}   /* needed because .pane sets its own display */
/* Focus timer */
.big{font-size:56px;font-weight:200;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.frow{display:grid;grid-template-columns:2fr 1fr;gap:8px}
/* Small progress pill on the dock itself, so you can see the timer without opening the menu */
.pill{display:inline-flex;margin-top:2.2vmin;padding:.7em 1.3em;border-radius:999px;
  font-size:clamp(13px,2.6vmin,20px);font-weight:300;font-variant-numeric:tabular-nums;
  border:1px solid var(--edge);color:var(--ink);
  background:linear-gradient(90deg,rgba(255,255,255,.24) var(--p,0%),var(--glass) var(--p,0%));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pill[hidden]{display:none}
.pill.ready{border-color:var(--b2);box-shadow:0 0 0 0 rgba(25,195,177,.6);animation:pulse 2.4s infinite}
/* Today's events, shown under the clock */
.agenda{list-style:none;padding:0;margin-top:2.6vmin;display:flex;flex-direction:column;gap:.9vmin}
.agenda li{display:flex;gap:.7em;align-items:baseline;font-size:clamp(13px,2.6vmin,20px);font-weight:300;color:var(--dim);white-space:nowrap}
.agenda li b{font-weight:400;font-variant-numeric:tabular-nums;min-width:5.4em}
.agenda li span{overflow:hidden;text-overflow:ellipsis}
.agenda li.now,.agenda li.next{color:var(--ink)}
.agenda li.link{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.agenda i{width:.6em;height:.6em;border-radius:50%;flex:none;align-self:center;background:var(--c,#fff)}
@media (max-aspect-ratio:1/1){.agenda li:nth-child(n+4){display:none}}  /* fewer lines on tall screens */
/* Right column: two equal halves, calendar on top, notes below */
.side{display:flex;flex-direction:column;gap:clamp(12px,3vmin,32px);min-height:0;min-width:0}
.side>section{flex:1 1 0;min-height:0}
.clock,.pill{-webkit-user-select:none;user-select:none}   /* double-clicking the clock area shouldn't highlight text */
/* Month calendar */
.cal{display:flex;flex-direction:column;padding:clamp(10px,2.2vmin,22px)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1vmin;
  font-size:clamp(13px,2.4vmin,18px);font-weight:600}
.calhead span{cursor:pointer}
.calhead button{width:2em;height:2em;border-radius:50%;opacity:.6;font-size:1.1em}
.calhead button:hover{opacity:1;background:rgba(255,255,255,.1)}
.calgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;
  align-items:center;text-align:center;font-size:clamp(11px,2.1vmin,17px);font-weight:300;font-variant-numeric:tabular-nums}
.calgrid .dow{color:var(--dim);font-size:.8em}
.calgrid .d{justify-self:center;display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%}
.calgrid .d.out{color:var(--dim);opacity:.45}
.calgrid .d.today{background:var(--ink);color:var(--bg);font-weight:600}
.status.bad{color:#ff8fab}
/* Quick links: bottom-left button + popup panel */
.bar.bl{top:auto;bottom:clamp(10px,2.5vmin,26px)}      /* same look as the menu button, but in the bottom-left corner */
#linksPanel{position:fixed;z-index:4;left:clamp(10px,2.5vmin,26px);
  bottom:calc(clamp(40px,7vmin,56px) + clamp(18px,4vmin,40px));width:min(440px,calc(100vw - 24px));
  max-height:calc(100% - 100px);overflow:auto;padding:18px;display:none;flex-direction:column;gap:14px;
  background:rgba(18,24,44,.55);animation:popup .22s ease-out}
#linksPanel.open{display:flex}
@keyframes popup{from{opacity:0;transform:translateY(8px) scale(.97)}}
.lhead{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.lhead b{font-weight:600}
.lhead button{font-size:13px;opacity:.7;padding:4px 12px;border-radius:10px}
.lhead button:hover,#linksPanel.editing .lhead button{opacity:1;background:rgba(255,255,255,.12)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 8px}
.tile{position:relative;border-radius:16px;min-width:0}
.tile.drag{opacity:.35}
.tile a,.addbtn{display:flex;flex-direction:column;align-items:center;gap:.5em;padding:.6em .3em;border-radius:16px;
  font-size:12px;font-weight:300;color:var(--ink);text-decoration:none;text-align:center;min-width:0;width:100%}
.tile a:hover,.addbtn:hover{background:rgba(255,255,255,.1)}
.tile img,.tile .ph{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.92);object-fit:contain;padding:8px}
.tile .ph{display:grid;place-items:center;padding:0;font-size:18px;font-weight:600;color:#10162a}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .rm{display:none;position:absolute;top:2px;right:8px;width:22px;height:22px;border-radius:50%;
  background:var(--b3);color:#2b0713;font-size:11px;place-items:center}
#linksPanel.editing .tile .rm{display:grid}            /* the red x only shows while editing */
.plus{width:44px;height:44px;border-radius:14px;border:1.5px dashed var(--edge);display:grid;place-items:center;font-size:22px}
.lform{display:flex;flex-direction:column;gap:8px}
.lform[hidden]{display:none}
#linksPanel input{padding:.8em 1em;border-radius:12px;color:var(--ink);background:rgba(255,255,255,.08);
  border:1px solid var(--edge);font-family:inherit;font-weight:300;font-size:14px}
.lscreen{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12px;color:var(--dim)}
.lscreen[hidden]{display:none}
.lscreen button{padding:6px 12px;border-radius:10px;border:1px solid var(--edge);font-size:12px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.blob,#menuBtn.on,.pill.ready{animation:none}}
</style>
</head>
<body>

<!-- The moving background -->
<div class="blobs" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<!-- Top-right buttons: white noise + fullscreen -->
<nav class="bar">
  <button id="menuBtn" aria-label="Open menu" aria-expanded="false" title="Focus, noise, colours, fullscreen">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>
  </button>
</nav>
<!-- Bottom-left: quick links button -->
<nav class="bar bl">
  <button id="linksBtn" aria-label="Quick links" aria-expanded="false" title="Quick links">
    <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>
  </button>
</nav>

<main class="dock">
  <section class="clock">
    <!-- Click the time to switch between 12h and 24h -->
    <div class="time" id="time" title="Click to switch 12h / 24h"><span id="hm">--:--</span><small id="sec"></small><small id="ampm"></small></div>
    <div class="date" id="date"></div>
    <!-- Shows while a focus session is running. Tap it to open the Focus tab. -->
    <button class="pill" id="pill" hidden><span id="pillText"></span></button>
    <ul class="agenda" id="agenda"></ul>
  </section>

  <div class="side">
    <section class="cal glass" aria-label="Calendar">
      <div class="calhead">
        <button id="calPrev" aria-label="Previous month">&#8249;</button>
        <span id="calTitle" title="Click to jump back to this month"></span>
        <button id="calNext" aria-label="Next month">&#8250;</button>
      </div>
      <div class="calgrid" id="calGrid"></div>
    </section>
    <section class="notes glass">
    <h2>Notes</h2>
    <ul id="list"></ul>
    <input id="newNote" placeholder="Add a note and press Enter" maxlength="140" autocomplete="off">
  </section>
  </div>
</main>

<!-- One menu for everything: tabs switch between Focus timer, White noise and Blob colours -->
<aside id="menuPanel" class="glass" aria-label="Dock menu">
  <div class="tabs" id="tabs">
    <button data-tab="focus">Focus</button><button data-tab="noise">Noise</button><button data-tab="colors">Colours</button><button data-tab="cal">Calendar</button>
  </div>

  <section class="pane" data-pane="focus">
    <div class="types" id="fModes">
      <button data-m="focus">Focus</button><button data-m="break">Break</button><button data-m="long">Long break</button>
    </div>
    <div class="big" id="fBig">25:00</div>
    <div class="frow"><button class="play" id="fStart">Start</button><button class="ghost" id="fReset">Reset</button></div>
    <label class="row"><b>Length <span id="fLenVal"></span></b><input type="range" id="fLen" min="1" max="90" value="25"></label>
    <div class="status" id="fStatus"></div>
  </section>

  <section class="pane" data-pane="noise" hidden>
  <div class="types" id="types">
    <button data-t="white" class="sel">White</button>
    <button data-t="pink">Pink</button>
    <button data-t="brown">Brown</button>
  </div>
  <button class="play" id="playBtn">Play</button>
  <label class="row"><b>Volume <span id="volVal">40%</span></b>
    <input type="range" id="vol" min="0" max="100" value="40"></label>
  <label class="row"><b>Softness <span id="toneVal"></span></b>
    <!-- Further left = softer (cuts the harsh high sounds) -->
    <input type="range" id="tone" min="0" max="100" value="100"></label>
  <label class="row">Sleep timer
    <select id="timer">
      <option value="0">Off</option><option value="15">15 minutes</option>
      <option value="30">30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option>
    </select></label>
  <div class="status" id="status"></div>
</section>

  <section class="pane" data-pane="colors" hidden>
  <div class="row">Presets</div>
  <div class="types" id="presets"></div>
  <div class="row">Pick each blob colour</div>
  <div class="swatches" id="swatches"></div>
  <button class="ghost" id="resetColors">Reset to Aurora</button>
</section>

  <section class="pane" data-pane="cal" hidden>
    <div class="row">Shows today's and tomorrow's events from your Google Calendar on the dock. Read-only: the dock can never change your events.</div>
    <button class="play" id="calBtn">Connect Google Calendar</button>
    <div class="status" id="calStatus"></div>
    <div class="status" id="calInfo"></div>
  </section>

  <div class="status">Fullscreen: double-click empty space, or press F</div>
</aside>

<!-- Quick links panel (opens above the bottom-left button) -->
<aside id="linksPanel" class="glass" aria-label="Quick links">
  <div class="lhead"><b>Quick links</b><button id="lnkEdit">Edit</button></div>
  <div class="lgrid" id="lgrid"></div>
  <div class="lform" id="lform" hidden>
    <input type="text" id="lnkUrl" placeholder="Website, e.g. github.com" autocomplete="off">
    <input type="text" id="lnkName" placeholder="Name (optional)" maxlength="40" autocomplete="off">
    <button class="play" id="lnkAdd">Add link</button>
  </div>
  <div class="lscreen" id="lscreenRow" hidden>
    <button id="lnkScreen">Open links on my other screen</button>
    <span id="lnkScreenInfo"></span>
  </div>
  <div class="status" id="lnkStatus"></div>
</aside>

<script src="config.js"></script>
<script>
/* ============ Helpers ============ */
const $ = id => document.getElementById(id);
/* localStorage can fail (private mode etc.), so every use is wrapped safely */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ============ Clock + date ============ */
let use24 = store.get('dock24', false);
let endAt = null;                       // when the sleep timer should stop the noise (ms), or null

function tick(){
  const d = new Date();
  let h = d.getHours();
  let suffix = '';
  if(use24){ h = String(h).padStart(2,'0'); }
  else { suffix = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; }
  $('hm').textContent = h + ':' + String(d.getMinutes()).padStart(2,'0');
  $('sec').textContent = String(d.getSeconds()).padStart(2,'0');
  $('ampm').textContent = suffix;
  $('date').textContent = d.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  if(d.toDateString() !== lastDay){ lastDay = d.toDateString(); calView = new Date(d.getFullYear(), d.getMonth(), 1); renderMonth(); }

  /* sleep timer check, done once a second together with the clock */
  if(endAt){
    const left = endAt - Date.now();
    if(left <= 0){ stopNoise(); endAt = null; $('timer').value = '0'; }
    else $('status').textContent = 'Stops in ' + Math.ceil(left/60000) + ' min';
  }
  focusTick();   // keeps the focus timer and its pill up to date
}
setInterval(tick, 1000);
$('time').onclick = () => { use24 = !use24; store.set('dock24', use24); tick(); };

/* ============ Notes ============ */
let notes = store.get('dockNotes', [{t:'Click a note to tick it off', done:false}]);
function renderNotes(){
  const ul = $('list'); ul.innerHTML = '';
  notes.forEach((n, i) => {
    const li = document.createElement('li');
    if(n.done) li.className = 'done';
    const span = document.createElement('span'); span.textContent = n.t;   // textContent = safe, no HTML injection
    const x = document.createElement('button'); x.textContent = '✕'; x.setAttribute('aria-label','Delete note');
    x.onclick = e => { e.stopPropagation(); notes.splice(i,1); saveNotes(); };

  });
}

/* ============ White noise (made live with the Web Audio API, no audio files needed) ============ */
let ctx, gain, filter, src, type = 'white', playing = false;
const buffers = {};                      // each noise type is generated once, then reused

function makeBuffer(kind){
  const len = ctx.sampleRate * 4;        // 4 seconds, looped forever
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let c = 0; c < 2; c++){
    const out = buf.getChannelData(c);
    let last = 0, b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i = 0; i < len; i++){
      const w = Math.random()*2 - 1;     // pure random = white noise
      if(kind === 'white') out[i] = w * .6;
      else if(kind === 'pink'){          // pink = white filtered so lows are stronger (Paul Kellet's method)
        b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852;
        b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898;
        out[i] = (b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6 = w*.115926;
      } else {                           // brown = even deeper, like a distant rumble
        last = (last + .02*w) / 1.02; out[i] = last * 3.2;
      }
    }
  }
  return buf;
}
/* Turns the 0-100 "softness" slider into a cut-off frequency between 300 Hz and 16 kHz */
const toneHz = v => 300 * Math.pow(16000/300, v/100);

function startNoise(){
  if(!ctx){                              // audio can only be created after a click, so we do it here
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    filter = ctx.createBiquadFilter(); filter.type = 'lowpass';
    gain = ctx.createGain();
    filter.connect(gain); gain.connect(ctx.destination);
    updateTone(); setVol();
  }
  if(ctx.state === 'suspended') ctx.resume();
  if(src){ src.stop(); src.disconnect(); }
  if(!buffers[type]) buffers[type] = makeBuffer(type);
  src = ctx.createBufferSource(); src.buffer = buffers[type]; src.loop = true;
  src.connect(filter); src.start();
  gain.gain.cancelScheduledValues(ctx.currentTime);
  setVol(); playing = true; refreshUI();
}
function stopNoise(){
  if(!playing) return;
  const s = src;                         // fade out over 0.6s so it doesn't click
  gain.gain.setTargetAtTime(0, ctx.currentTime, .15);
  setTimeout(() => { try{ s.stop(); }catch(e){} }, 700);
  src = null; playing = false; refreshUI();
}
function setVol(){ if(gain) gain.gain.setTargetAtTime(($('vol').value/100) ** 2, ctx.currentTime, .05); } // squared = feels smoother to the ear
function updateTone(){ const hz = toneHz($('tone').value); $('toneVal').textContent = hz > 15000 ? 'full' : Math.round(hz) + ' Hz'; if(filter) filter.frequency.setTargetAtTime(hz, ctx.currentTime, .05); }
function refreshUI(){
  $('playBtn').textContent = playing ? 'Stop' : 'Play';
  $('playBtn').classList.toggle('on', playing);
  $('menuBtn').classList.toggle('on', playing || fRunning);
  if(!endAt) $('status').textContent = playing ? 'Playing ' + type + ' noise' : '';
}

$('playBtn').onclick = () => playing ? stopNoise() : startNoise();

  const t = e.target.dataset.t; if(!t) return;
  type = t;
  document.querySelectorAll('#types button').forEach(b => b.classList.toggle('sel', b.dataset.t === t));

};

/* ============ Focus timer (Pomodoro style) ============
   Works from real clock times instead of "count one per second", so it stays
   accurate even if the browser slows this page down in the background. */
const MODES = {focus:'Focus', break:'Break', long:'Long break'};
const DEFAULT_MINS = {focus:25, break:5, long:15};
let mins = store.get('dockFocusMins', DEFAULT_MINS);
if(!mins || typeof mins !== 'object') mins = {...DEFAULT_MINS};
for(const k in DEFAULT_MINS) if(!(mins[k] >= 1 && mins[k] <= 90)) mins[k] = DEFAULT_MINS[k];

let fMode = 'focus';              // which kind of session is selected
let fRunning = false;             // is the countdown going?
let fReady = false;               // a session just ended and the next one is waiting to start
let fEnd = 0;                     // clock time (ms) the running session ends at
let fLeft = mins.focus * 60000;   // ms left while paused or not started
let chimeCtx;                     // small audio context just for the end-of-session chime
const day = () => new Date().toDateString();
let done = store.get('dockFocusDone', null);
if(!done || done.d !== day()) done = {d: day(), n: 0};   // the "sessions done" count resets each day

const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

function fRender(){
  const total = mins[fMode] * 60000;
  const left = fRunning ? Math.max(0, fEnd - Date.now()) : fLeft;
  const started = fRunning || left < total;                  // running, or paused part-way
  $('fBig').textContent = fmt(left);
  $('fStart').textContent = fRunning ? 'Pause' : (left < total ? 'Resume' : 'Start');
  $('fStart').classList.toggle('on', fRunning);
  $('fLen').value = mins[fMode]; $('fLenVal').textContent = mins[fMode] + ' min';
  $('fLen').disabled = started;                              // can't change length mid-session
  document.querySelectorAll('#fModes button').forEach(b => b.classList.toggle('sel', b.dataset.m === fMode));
  $('fStatus').textContent = done.n ? done.n + ' focus session' + (done.n > 1 ? 's' : '') + ' done today' : '';
  /* the pill on the dock */
  $('pill').hidden = !(started || fReady);
  $('pill').classList.toggle('ready', fReady && !fRunning);
  $('pill').style.setProperty('--p', (started ? 100 - left / total * 100 : 0) + '%');
  $('pillText').textContent = fReady && !fRunning ? MODES[fMode] + ' ready, tap to start'
                            : MODES[fMode] + ' ' + fmt(left) + (fRunning ? '' : ' (paused)');
  document.title = fRunning ? fmt(left) + ' · ' + MODES[fMode] : 'Desk Dock';
}

/* Three short beeps when a session ends */
function chime(){
  if(!chimeCtx) return;
  [0, .35, .7].forEach(t => {
    const o = chimeCtx.createOscillator(), g = chimeCtx.createGain(), t0 = chimeCtx.currentTime + t;
    o.frequency.value = 880;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.25, t0 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + .3);
    o.connect(g); g.connect(chimeCtx.destination); o.start(t0); o.stop(t0 + .32);
  });
}

function finish(){
  fRunning = false; chime();
  if(fMode === 'focus'){                                      // after every 4th focus session: long break
    done = {d: day(), n: done.n + 1}; store.set('dockFocusDone', done);
    fMode = done.n % 4 === 0 ? 'long' : 'break';
  } else fMode = 'focus';
  fLeft = mins[fMode] * 60000; fReady = true;                 // next session waits for you to start it
}

/* Called once a second from tick() */
function focusTick(){
  if(fRunning && Date.now() >= fEnd) finish();
  fRender();
  $('menuBtn').classList.toggle('on', playing || fRunning);   // menu button glows if noise or timer is active
}

$('fStart').onclick = () => {
  if(fRunning){ fLeft = Math.max(0, fEnd - Date.now()); fRunning = false; }          // pause
  else {
    chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)();   // created on a click so the browser allows sound
    if(chimeCtx.state === 'suspended') chimeCtx.resume();
    fEnd = Date.now() + fLeft; fRunning = true; fReady = false;
  }
  fRender();
};
$('fReset').onclick = () => { fRunning = false; fReady = false; fLeft = mins[fMode] * 60000; fRender(); };
$('fModes').onclick = e => {
  const m = e.target.dataset.m; if(!m) return;
  fMode = m; fRunning = false; fReady = false; fLeft = mins[m] * 60000; fRender();
};

/* ============ Google Calendar (read-only) ============
   Uses Google's sign-in popup, then asks the Calendar API for today's and tomorrow's
   events. Everything happens in your browser: there is no server, and your calendar
   data is never stored, only shown. */
const GCAL_CLIENT_ID = (window.DOCK_CONFIG && DOCK_CONFIG.googleClientId) || '';   // comes from config.js
const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const gcalReady = !!GCAL_CLIENT_ID && !GCAL_CLIENT_ID.includes('PASTE_');   // false until config.js has a real ID

let gTok = null;        // access token (Google gives one that lasts about an hour)
let gExp = 0;           // when that token runs out (ms)
let gClient = null;     // Google's token helper
let gEvents = [];       // events from the last refresh
let gState = 'off';     // 'off' | 'ok' | 'reconnect' (needs a tap) | 'error'
let gNext = 0;          // when to refresh next (ms)
let gTry = 0;           // when we last tried to reconnect by ourselves (ms)
let gUpdated = null;    // time of last good refresh
let gWasOn = store.get('dockGcal', false);   // did you connect before?
let gErr = '';          // last error text, shown in the Calendar tab so we can see what went wrong
let gMsg = '';          // temporary message such as 'Opening Google sign-in...'
let gTimer = null;      // fires if Google never answers, so you get a hint instead of silence
function gDone(){ clearTimeout(gTimer); gMsg = ''; }   // call when Google has answered (success or failure)

const tm = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12: !use24});
const sameDay = (a, b) => a.toDateString() === b.toDateString();

/* Load Google's sign-in script (once, even if asked for several times) */
let gsiQueue = null;
function loadGsi(cb){
  if(window.google && google.accounts) return cb();      // already loaded: run straight away
  if(gsiQueue){ gsiQueue.push(cb); return; }             // loading right now: wait for it
  gsiQueue = [cb];
  const sc = document.createElement('script');
  sc.src = 'https://accounts.google.com/gsi/client';
  sc.onload = () => { const q = gsiQueue; gsiQueue = null; q.forEach(f => f()); };
  sc.onerror = () => { gDone(); gsiQueue = null; gErr = "can't load Google's sign-in script (offline or blocked?)"; gState = 'error'; calUI(); };
  document.head.append(sc);
}
/* Set up Google's token helper (only once) */
function initGcalClient(){
  if(gClient) return;
  gClient = google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID, scope: GCAL_SCOPE,
    callback: r => {
      gDone();
      if(!r || r.error || !r.access_token){ gErr = (r && r.error) || 'no token returned'; gState = 'reconnect'; return calUI(); }
      gTok = r.access_token; gExp = Date.now() + (r.expires_in - 120) * 1000;
      gErr = ''; gWasOn = true; store.set('dockGcal', true); gState = 'ok'; refreshCal();
    },
    error_callback: err => { gDone(); gErr = (err && err.type) || 'unknown'; gState = 'reconnect'; calUI(); }   // popup blocked or closed
  });
}
/* Ask Google for a token. Must run inside a tap/click, or the browser blocks the popup. */
function calConnect(){
  if(!gcalReady){ calUI(); return; }          // calUI explains what is missing
  gErr = ''; gMsg = 'Opening Google sign-in...'; calUI();
  clearTimeout(gTimer);
  gTimer = setTimeout(() => {
    gMsg = 'No sign-in window appeared. Allow popups for this site (look for the blocked-popup icon in the address bar), press F to leave fullscreen, then try again.';
    calUI();
  }, 6000);
  loadGsi(() => {
    initGcalClient();
    const hint = store.get('dockGcalHint', '');          // your email: lets Google skip the "choose account" step
    gClient.requestAccessToken(hint ? {prompt: '', hint} : {prompt: ''});
  });
}
function calDisconnect(){
  if(gTok && window.google) google.accounts.oauth2.revoke(gTok, () => {});
  gTok = null; gEvents = []; gState = 'off'; gWasOn = false; store.set('dockGcal', false); calUI();
}

/* Small helper: call the Calendar API with our token */
async function gGet(url){
  const r = await fetch(url, {headers: {Authorization: 'Bearer ' + gTok}});
  if(r.status === 401){ gTok = null; throw new Error('expired'); }
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function refreshCal(){
  if(!gTok || Date.now() > gExp){                 // token missing or run out
    gState = 'reconnect'; calUI();
    if(Date.now() - gTry > 5 * 60000){ gTry = Date.now(); calConnect(); }   // quietly retry, at most every 5 min
    return;
  }
  try{
    /* the calendars you have ticked in Google Calendar (up to 8) */
    const all = (await gGet('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=50')).items || [];
    const me = all.find(c => c.primary);                 // your main calendar's id is your email address
    if(me) store.set('dockGcalHint', me.id);             // kept only in this browser
    const cals = all.filter(c => c.selected).slice(0, 8);
    const from = new Date(); from.setHours(0, 0, 0, 0);
    const to = new Date(from); to.setDate(to.getDate() + 2);          // start of today to end of tomorrow
    const q = 'singleEvents=true&orderBy=startTime&maxResults=25&timeMin=' + encodeURIComponent(from.toISOString())
            + '&timeMax=' + encodeURIComponent(to.toISOString());
    const lists = await Promise.all(cals.map(c =>
      gGet('https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(c.id) + '/events?' + q)
        .then(j => (j.items || [])
          .filter(e => e.status !== 'cancelled' && !(e.attendees || []).some(a => a.self && a.responseStatus === 'declined'))
          .map(e => ({
            title: e.summary || '(no title)',
            allDay: !!e.start.date,
            start: new Date(e.start.dateTime || e.start.date + 'T00:00:00'),   // date-only = all-day, local midnight
            end: new Date(e.end.dateTime || e.end.date + 'T00:00:00'),
            color: c.backgroundColor
          })))
        .catch(() => [])));                                              // one broken calendar doesn't break the rest
    gEvents = lists.flat().sort((a, b) => a.start - b.start);
    gState = 'ok'; gErr = ''; gUpdated = new Date(); gNext = Date.now() + 5 * 60000;
  }catch(err){
    gState = err.message === 'expired' ? 'reconnect' : 'error'; gErr = err.message === 'expired' ? '' : err.message; gNext = Date.now() + 60000;
  }
  calUI();
}

/* Draw the event list under the clock */
function renderAgenda(){
  const ul = $('agenda'); ul.innerHTML = '';
  const add = (label, text, cls, color) => {
    const li = document.createElement('li'); if(cls) li.className = cls;
    const b = document.createElement('b'); b.textContent = label;
    const sp = document.createElement('span'); sp.textContent = text;      // textContent: event titles can't inject HTML
    if(color){ const i = document.createElement('i'); i.style.setProperty('--c', color); li.append(i); }
    li.append(b, sp); ul.append(li); return li;
  };
  if(gState === 'reconnect'){ add('', 'Google Calendar: tap to reconnect', 'link').onclick = calConnect; return; }
  if(gState === 'error'){ add('', "Calendar couldn't update, retrying", ''); return; }
  if(gState !== 'ok') return;
  const now = new Date(), today = new Date();
  const upcoming = gEvents.filter(e => e.end > now).slice(0, 4);
  if(!upcoming.length){ add('', 'Nothing else coming up', ''); return; }
  let firstNext = false;
  upcoming.forEach(e => {
    const isNow = e.start <= now;
    const cls = isNow ? 'now' : (!firstNext ? 'next' : ''); if(!isNow) firstNext = true;
    const day = sameDay(e.start, today) ? '' : 'Tmrw ';
    add(e.allDay ? day + 'All day' : day + tm(e.start), e.title, cls, e.color);
  });
}

/* Keep the Calendar tab in the menu in step with what's happening */
function calUI(){
  const btn = $('calBtn'), st = $('calStatus');
  btn.textContent = gState === 'ok' ? 'Disconnect' : (gState === 'reconnect' || gWasOn ? 'Reconnect' : 'Connect Google Calendar');
  st.textContent = !gcalReady ? 'Setup needed: paste your Google client ID into config.js first.'
    : gState === 'ok' ? 'Connected. Updated ' + tm(gUpdated)
    : gState === 'reconnect' ? 'Needs one tap to reconnect (Google sign-ins last about an hour).'
    : gState === 'error' ? "Couldn't reach Google Calendar, retrying." : '';
  const bad = !gcalReady || gState === 'error' || (!!gErr && gErr !== 'popup_failed_to_open' && gState !== 'ok');
  if(gErr && gErr !== 'popup_failed_to_open' && gState !== 'ok') st.textContent += ' Error: ' + gErr;
  if(gMsg) st.textContent = gMsg;
  st.classList.toggle('bad', bad || (!!gMsg && gMsg.startsWith('No sign-in')));
  /* what this page looks like to Google: the origin must exactly match an Authorized JavaScript origin */
  $('calInfo').textContent = 'This page: ' + location.origin + (window.isSecureContext ? '' : ' (NOT a secure https page)')
    + ' · client ID ' + (gcalReady ? 'found' : 'missing');
  renderAgenda();
}
$('calBtn').onclick = () => gState === 'ok' ? calDisconnect() : calConnect();
/* Every 30 seconds: redraw (so "now" and "next" stay right) and refresh data when it's due */
setInterval(() => { renderAgenda(); if(gWasOn && gcalReady && Date.now() >= gNext) refreshCal(); }, 30000);
/* If you connected before, try to reconnect when the page opens */
if(gcalReady) loadGsi(initGcalClient);   // warm up now, so a later tap can open the popup instantly
if(gWasOn && gcalReady){ gState = 'reconnect'; gTry = Date.now(); calConnect(); }
calUI();

/* ============ Month calendar ============
   A plain month grid with today highlighted. Arrows change month; clicking the
   month name jumps back to this month. */
let calView = new Date();        // the month being shown (always the 1st of that month)
let lastDay = '';                // used to notice when midnight passes
/* Which day does your week start on? Asks the browser; falls back to Monday. (0 = Sunday ... 6 = Saturday) */
function weekStart(){
  try{
    const l = new Intl.Locale(navigator.language);
    const w = l.getWeekInfo ? l.getWeekInfo() : l.weekInfo;
    if(w && w.firstDay) return w.firstDay % 7;       // browsers number Sunday as 7, so % 7 turns it into 0
  }catch(e){}
  return 1;
}
function renderMonth(){
  const g = $('calGrid'); g.innerHTML = '';
  const first = new Date(calView.getFullYear(), calView.getMonth(), 1), ws = weekStart();
  $('calTitle').textContent = first.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  const cell = (cls, text) => { const el = document.createElement('div'); el.className = cls; el.textContent = text; g.append(el); };
  for(let i = 0; i < 7; i++)                          // weekday letters (1 Jan 2023 was a Sunday)
    cell('dow', new Date(2023, 0, 1 + (ws + i) % 7).toLocaleDateString(undefined, {weekday:'narrow'}));
  const offset = (first.getDay() - ws + 7) % 7;       // greyed days shown before the 1st
  const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const total = Math.ceil((offset + daysInMonth) / 7) * 7;   // fill whole weeks
  const today = new Date().toDateString();
  for(let i = 0; i < total; i++){
    const d = new Date(first.getFullYear(), first.getMonth(), 1 - offset + i);
    cell('d' + (d.getMonth() !== first.getMonth() ? ' out' : '') + (d.toDateString() === today ? ' today' : ''), d.getDate());
  }
}
$('calPrev').onclick = () => { calView = new Date(calView.getFullYear(), calView.getMonth() - 1, 1); renderMonth(); };
$('calNext').onclick = () => { calView = new Date(calView.getFullYear(), calView.getMonth() + 1, 1); renderMonth(); };
$('calTitle').onclick = () => { calView = new Date(); calView.setDate(1); renderMonth(); };

/* ============ Quick links (like Brave favorites) ============
   Saved in this browser only. Each link is {n: name, u: address}. */
let links = store.get('dockLinks', []);
if(!Array.isArray(links)) links = [];
links = links.filter(l => l && typeof l.u === 'string' && typeof l.n === 'string');   // drop anything malformed
let dragFrom = null;             // position of the tile being dragged

/* Turns what you typed into a web address. "github.com" becomes "https://github.com/".
   Only http and https are allowed, so things like javascript: links are rejected. */
function cleanUrl(raw){
  raw = raw.trim(); if(!raw) return null;
  if(!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
  try{ const u = new URL(raw); return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null; }catch(e){ return null; }
}
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(e){ return u; } };
function saveLinks(){ store.set('dockLinks', links); renderLinks(); }

/* ----- Opening links in a separate window, away from the dock -----
   A normal link would open a new TAB in the dock's own window and push the dock out of view.
   Instead we open a small pop-up WINDOW. Set this to false if you want a brand new window
   for every link instead of reusing one companion window. */
const REUSE_LINK_WINDOW = true;

/* Optional: if the browser supports it (Chrome/Edge style "Window Management"), you can allow
   the dock to see your screens once, and links then open on your OTHER screen. */
let screenInfo = null;                       // live list of your screens (filled in after you allow it)
async function loadScreens(){
  if(!('getScreenDetails' in window)) return false;
  try{
    screenInfo = await window.getScreenDetails();             // the browser asks for permission here
    screenInfo.addEventListener('screenschange', refreshScreenUI);   // plugged/unplugged a monitor
    return true;
  }catch(e){ return false; }                                  // false = you said no
}
/* A screen that is NOT the one the dock is on (prefers your main screen) */
function otherScreen(){
  if(!screenInfo) return null;
  const here = screenInfo.currentScreen;
  const others = screenInfo.screens.filter(sc => sc.left !== here.left || sc.top !== here.top);
  return others.find(sc => sc.isPrimary) || others[0] || null;
}
function refreshScreenUI(){
  const row = $('lscreenRow');
  if(!('getScreenDetails' in window)){ row.hidden = true; return; }   // this browser can't choose a screen
  row.hidden = false;
  const o = otherScreen();
  $('lnkScreenInfo').textContent = !screenInfo ? 'Links open in a pop-up window on this screen.'
    : o ? 'Links open on: ' + (o.label || (o.isPrimary ? 'your main screen' : 'your other screen'))
    : 'Only one screen found, so links open on this screen.';
  $('lnkScreen').textContent = screenInfo ? 'Re-detect screens' : 'Open links on my other screen';
}
$('lnkScreen').onclick = async () => {
  const ok = await loadScreens();
  if(!ok) $('lnkStatus').textContent = 'Screen access was not allowed, so links open on this screen.';
  refreshScreenUI();
};

/* Opens the address in a pop-up window sized to 85% of the target screen. Returns false if the browser blocked it. */
function openAway(url){
  const t = otherScreen();                   // null means: same screen as the dock
  const aw = t ? t.availWidth : screen.availWidth, ah = t ? t.availHeight : screen.availHeight;
  const w = Math.round(aw * 0.85), h = Math.round(ah * 0.85);
  const left = Math.round((t ? t.availLeft : (screen.availLeft || 0)) + (aw - w) / 2);
  const top  = Math.round((t ? t.availTop  : (screen.availTop  || 0)) + (ah - h) / 2);
  /* a named window ('dock-links') is reused for every link; '_blank' makes a new one each time */
  const win = window.open(url, REUSE_LINK_WINDOW ? 'dock-links' : '_blank', 'popup,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
  if(!win) return false;
  try{ win.opener = null; }catch(e){}        // the opened site gets no handle back to the dock
  win.focus();
  return true;
}

function renderLinks(){
  const grid = $('lgrid'); grid.innerHTML = '';
  links.forEach((l, i) => {
    const name = l.n || hostOf(l.u);
    const box = document.createElement('div'); box.className = 'tile'; box.draggable = true;   // the box is what you drag
    const a = document.createElement('a');
    a.href = l.u; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = l.u; a.draggable = false;
    /* while editing, tapping a tile must not open the site; otherwise close the panel as the site opens */
    a.onclick = e => {
      if($('linksPanel').classList.contains('editing')){ e.preventDefault(); return; }   // editing: don't open anything
      if(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;                       // modifier keys: normal browser behaviour
      e.preventDefault();                                                                // we open the window ourselves
      if(openAway(l.u)) closeLinks();
      else $('lnkStatus').textContent = 'The browser blocked the new window. Allow pop-ups for this site and try again.';
    };
    /* icon: the site's favicon (fetched through Google's favicon service); a letter if it can't load */
    const img = new Image(); img.alt = ''; img.draggable = false;
    img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(hostOf(l.u));
    img.onerror = () => { const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = (name[0] || '?').toUpperCase(); img.replaceWith(ph); };
    const sp = document.createElement('span'); sp.textContent = name;      // textContent: names can't inject HTML
    a.append(img, sp);
    const x = document.createElement('button'); x.className = 'rm'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove ' + name);
    x.onclick = () => { links.splice(i, 1); saveLinks(); };
    box.append(a, x);
    /* drag one tile onto another to move it there */
    box.ondragstart = e => { dragFrom = i; box.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; };
    box.ondragend = () => box.classList.remove('drag');
    box.ondragover = e => e.preventDefault();
    box.ondrop = e => {
      e.preventDefault();
      if(dragFrom === null || dragFrom === i) return;
      const [moved] = links.splice(dragFrom, 1); links.splice(i, 0, moved); dragFrom = null; saveLinks();
    };
    grid.append(box);
  });
  /* the "+" tile shows or hides the add-link form */
  const add = document.createElement('button'); add.className = 'addbtn';
  const plus = document.createElement('div'); plus.className = 'plus'; plus.textContent = '+';
  const lab = document.createElement('span'); lab.textContent = 'Add';
  add.append(plus, lab);
  add.onclick = () => { $('lform').hidden = !$('lform').hidden; if(!$('lform').hidden) $('lnkUrl').focus(); };
  grid.append(add);
}
/* open / close the panel, and the Edit toggle (shows red x buttons so links can be removed) */
function openLinks(){ closeMenu(); $('linksPanel').classList.add('open'); $('linksBtn').setAttribute('aria-expanded', 'true'); }
function closeLinks(){
  $('linksPanel').classList.remove('open', 'editing'); $('lnkEdit').textContent = 'Edit';
  $('lform').hidden = true; $('lnkStatus').textContent = ''; $('linksBtn').setAttribute('aria-expanded', 'false');
}
$('linksBtn').onclick = () => $('linksPanel').classList.contains('open') ? closeLinks() : openLinks();
$('lnkEdit').onclick = () => { const on = $('linksPanel').classList.toggle('editing'); $('lnkEdit').textContent = on ? 'Done' : 'Edit'; };
function addLink(){
  const u = cleanUrl($('lnkUrl').value);
  if(!u){ $('lnkStatus').textContent = "That doesn't look like a web address."; return; }
  if(links.length >= 24){ $('lnkStatus').textContent = 'That is the maximum of 24 links.'; return; }
  links.push({n: $('lnkName').value.trim().slice(0, 40), u});
  $('lnkUrl').value = ''; $('lnkName').value = ''; $('lnkStatus').textContent = '';
  saveLinks();
}
$('lnkAdd').onclick = addLink;
[$('lnkUrl'), $('lnkName')].forEach(el => el.addEventListener('keydown', e => { if(e.key === 'Enter') addLink(); }));
renderLinks();
refreshScreenUI();
if('getScreenDetails' in window && navigator.permissions){
  /* permission already granted earlier? then pick up the screens silently (the permission was renamed once, so try both names) */
  navigator.permissions.query({name: 'window-management'})
    .catch(() => navigator.permissions.query({name: 'window-placement'}))
    .then(pm => { if(pm.state === 'granted') loadScreens().then(refreshScreenUI); })
    .catch(() => {});
}

/* ============ Fullscreen (+ keep the screen awake) ============ */
let wake = null;
async function keepAwake(){ try{ if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', () => { if(!document.hidden && document.fullscreenElement) keepAwake(); });
function toggleFs(){
  if(!document.documentElement.requestFullscreen) return;     // e.g. iPhone Safari has no fullscreen API
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
/* Double-click on empty space (anything that isn't a button, field, panel or event line) */
addEventListener('dblclick', e => {
  if(e.target.closest('button, input, select, textarea, label, a, .glass, .agenda')) return;
  getSelection().removeAllRanges();                            // clear any text the double-click highlighted
  toggleFs();
});
/* F key (ignored while you're typing in a field, or if Ctrl/Cmd/Alt is held) */
addEventListener('keydown', e => {
  if((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat
     && !e.target.closest('input, textarea, select, [contenteditable]')){ e.preventDefault(); toggleFs(); }
});
document.addEventListener('fullscreenchange', () => {
  if(document.fullscreenElement) keepAwake(); else if(wake){ wake.release(); wake = null; }
});

/* ============ Idle: hide buttons + cursor after 5s of no activity ============ */
let idleTimer;
function wakeUI(){
  document.body.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    const busy = $('menuPanel').classList.contains('open') || $('linksPanel').classList.contains('open') || document.activeElement === $('newNote');
    if(!busy) document.body.classList.add('idle'); else wakeUI();
  }, 5000);
}
['mousemove','pointerdown','keydown','touchstart'].forEach(ev => addEventListener(ev, wakeUI, {passive:true}));
addEventListener('keydown', e => { if(e.key === 'Escape'){ closeMenu(); closeLinks(); } });
wakeUI();
tick();   // first draw of the clock (done last so everything above is ready)

/* ============ No offline cache ============
   Earlier versions saved a copy of the dock on the device. This tidies that up:
   it removes any old service worker and deletes any saved copies, so the page
   always loads fresh from the internet. (You can delete this block in a few weeks.) */
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if(window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
